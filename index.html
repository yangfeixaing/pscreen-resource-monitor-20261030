<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>资源监测</title><style>
:root{color-scheme:dark;--bg:#0b1220;--card:#151f30;--muted:#93a4ba;--text:#edf5ff;--green:#3dd68c;--border:#29394e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#142c37 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1220px;margin:auto;padding:36px 24px 56px}header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}h1{font-size:32px;letter-spacing:.02em;margin:4px 0}h2{font-size:19px;margin:32px 0 14px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.17em;color:#71cda7;font-weight:700}.hint,.muted{color:var(--muted)}.state{padding:7px 12px;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.servers{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--border);border-radius:16px;background:linear-gradient(150deg,#19263a,#121b2a);padding:20px;min-width:0;box-shadow:0 9px 25px #0002}.title{display:flex;align-items:center;justify-content:space-between;font-weight:700;gap:8px}.badge{font-size:11px;font-weight:500;border-radius:20px;padding:3px 8px;color:#86d9b6;background:#1b3e38}.badge.bad{color:#ffc69a;background:#503c2f}.metric{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:14px 0 2px}.secondary{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}.datum{min-width:0;flex:1}.datum b{font-size:19px;display:block}.datum small{color:var(--muted)}.bars{height:5px;border-radius:8px;background:#304052;overflow:hidden;margin-top:8px}.bars i{height:100%;display:block;background:var(--green);border-radius:8px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.go{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mono{font-variant-numeric:tabular-nums}.footer{margin-top:28px;font-size:13px;color:var(--muted)}@media(max-width:760px){main{padding:24px 16px}h1{font-size:27px}.grid,.servers{grid-template-columns:1fr}.grid.two{grid-template-columns:1fr}.metric{font-size:30px}}
</style></head><body><main><header><div><div class="eyebrow">LIVE RESOURCE MONITOR</div><h1>资源监测</h1><div class="hint">与小屏使用相同的数据来源 · 每 3 分钟采集</div></div><div class="state" id="connection">正在连接…</div></header>
<h2>账户用量</h2><section class="grid" id="accounts"></section><h2>服务器资源</h2><section class="grid servers" id="servers"></section><h2>OpenCode Go</h2><section class="grid two" id="go"></section><div class="footer" id="footer">正在等待数据。数据由本机独立采集，页面每 3 分钟检查更新。</div></main>
<script>
const ids=['mimo','codex','grok','yfx','yfxgpu','uroexplore','opencode_a','opencode_b','opencode_c'];
const accounts=document.getElementById('accounts'),servers=document.getElementById('servers'),go=document.getElementById('go');
function element(tag,cls,text){let el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function card(title,item){let el=element('article','card');let top=element('div','title');top.append(element('span','',title));let ok=item?.status==='ok';top.append(element('span','badge'+(ok?'':' bad'),ok?'正常':item?.status==='loading'?'采集中':'暂不可用'));el.append(top);return el}
function number(n,d=0){return typeof n==='number'&&Number.isFinite(n)?n.toFixed(d):'--'}function percent(n){return typeof n==='number'&&Number.isFinite(n)?number(n)+'%':'--'}function value(item){return item?.status==='ok'&&item.values?item.values:{}}function date(v){if(!v)return '--';let n=typeof v==='number'?v*1000:v;let d=new Date(n);return isNaN(d)?'--':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function addDatum(parent,label,val,pct){let d=element('div','datum');d.append(element('small','',label),element('b','mono',val));if(typeof pct==='number'&&Number.isFinite(pct)){let bar=element('div','bars'),i=element('i');i.style.width=Math.max(0,Math.min(100,pct))+'%';bar.append(i);d.append(bar)}parent.append(d);return d}
function render(s){accounts.replaceChildren();servers.replaceChildren();go.replaceChildren();let a=card('MiMo',s.mimo),v=value(s.mimo);a.append(element('div','metric mono',percent(v.pct)),element('div','muted','本月剩余 · 重置 '+date(v.reset)));let b=element('div','secondary');addDatum(b,'已使用',v.used==null?'--':number(v.used));addDatum(b,'总额度',v.limit==null?'--':number(v.limit));a.append(b);accounts.append(a);
 a=card('Codex',s.codex);v=value(s.codex);a.append(element('div','metric mono',percent(v.weekly_remaining)),element('div','muted','本周剩余 · 重置 '+date(v.weekly_reset)));accounts.append(a);
 a=card('Grok',s.grok);v=value(s.grok);let remain=typeof v.used_pct==='number'?100-v.used_pct:null;a.append(element('div','metric mono',percent(remain)),element('div','muted','本周剩余 · 重置 '+date(v.period_end)));accounts.append(a);
 for(let [id,label] of [['yfx','YFX · CPU'],['yfxgpu','YFX · GPU'],['uroexplore','UROEXPLORE']]){let it=s[id];v=value(it);a=card(label,it);a.append(element('div','muted',v.tag||'--'));b=element('div','secondary');if(typeof v.gpu_pct==='number'){addDatum(b,'GPU',percent(v.gpu_pct),v.gpu_pct);addDatum(b,'显存',v.gpu_mem_used_gb==null?'--':number(v.gpu_mem_used_gb,1)+'G',v.gpu_mem_pct);addDatum(b,'CPU',percent(v.cpu_pct),v.cpu_pct)}else{addDatum(b,'CPU',percent(v.cpu_pct),v.cpu_pct);addDatum(b,'内存',percent(v.mem_pct),v.mem_pct);addDatum(b,'磁盘',v.home_used&&v.home_size?v.home_used+' / '+v.home_size:'--',v.home_pct)}a.append(b);servers.append(a)}
 for(let [id,label] of [['opencode_a','OpenCode Go · A'],['opencode_b','OpenCode Go · B'],['opencode_c','OpenCode Go · C']]){let it=s[id];v=value(it);a=card(label,it);b=element('div','secondary');for(let [key,title] of [['rolling','5 小时剩余'],['monthly','本月剩余']]){let w=v[key];let txt=w?.kind==='pct'?percent(w.remaining):w?.kind==='status'?w.text:'--';let row=addDatum(b,title,txt,w?.kind==='pct'?w.remaining:null);row.append(element('small','', '重置 '+date(w?.resets_at)))}a.append(b);go.append(a)}
 let times=ids.map(id=>s[id]?.at).filter(x=>typeof x==='number');document.getElementById('footer').textContent=times.length?'最近一次采集：'+new Date(Math.max(...times)*1000).toLocaleString('zh-CN',{hour12:false})+' · 浏览器每 3 分钟检查更新；数据源按各自周期更新。':'正在等待数据。数据由本机独立采集，页面每 3 分钟检查更新。';}
const GIST_ID='aa882b7b7a5aaaae3592373060773a67';
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function update(){try{const secret=location.hash.slice(1);if(!secret)throw Error('请使用包含完整访问密钥的链接');let res=await fetch('https://api.github.com/gists/'+GIST_ID+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('数据暂不可用');let gist=await res.json();let enc=JSON.parse(gist.files['status.json'].content);let key=await crypto.subtle.importKey('raw',b64(secret),{name:'AES-GCM'},false,['decrypt']);let raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.nonce)},key,b64(enc.data));let data=JSON.parse(new TextDecoder().decode(raw));let now=Date.now()/1000;for(let v of Object.values(data.sources)){if(v.at&&now-v.at>480){v.status='unavailable';v.values={}}}render(data.sources);let c=document.getElementById('connection');let age=now-data.published_at;c.textContent=age>480?'● 来源电脑离线或数据已过期':'● 数据已连接';c.style.color=age>480?'#ffc69a':'#86d9b6'}catch(e){let c=document.getElementById('connection');c.textContent='● '+(e.message||'数据不可用');c.style.color='#ffc69a'}}update();setInterval(update,180000);
</script></body></html>
